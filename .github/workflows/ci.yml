name: Validation
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      integration:
        description: Run against an already deployed self-hosted cluster
        type: boolean
        default: false
      host:
        description: Optional NodePort IP; defaults to the cluster node IP
        type: string
        required: false
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.35.9
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements.lock'
      - run: sudo apt-get update && sudo apt-get install -y shellcheck poppler-utils
      - run: ./scripts/lint.sh
  integration:
    # Runner must have a deployed cluster, KUBECONFIG, and MTC_CA_FILE set to
    # its generated public CA certificate. No credentials are uploaded.
    if: github.event_name == 'workflow_dispatch' && inputs.integration
    needs: static
    runs-on: [self-hosted, linux, mtc-hack]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run full cluster acceptance
        env:
          VERIFY_HOST: ${{ inputs.host }}
        shell: bash
        run: |
          args=(--ca "${MTC_CA_FILE:?Set MTC_CA_FILE on the integration runner}")
          if [[ -n "$VERIFY_HOST" ]]; then args+=(--host "$VERIFY_HOST"); fi
          ./scripts/verify.sh "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cluster-verification
          path: |
            artifacts/verification.json
            artifacts/verification.xml
          if-no-files-found: warn

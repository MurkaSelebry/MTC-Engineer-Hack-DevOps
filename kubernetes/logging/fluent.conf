<system>
  workers 1
  log_level info
</system>

# Only demo Nginx containers; no Kubernetes API token or broad cluster logging.
# The '*' tag expansion identifies the file/container. concat also keys by stream.
<source>
  @type tail
  @id demo_containers
  path "#{ENV.fetch('FLUENT_LOG_PATH', '/var/log/containers/demo-*_demo_nginx-*.log')}"
  pos_file "#{ENV.fetch('FLUENT_STATE_PATH', '/var/lib/fluentd')}/containers.pos"
  tag demo.*
  path_key source_path
  read_from_head true
  follow_inodes true
  rotate_wait 30
  refresh_interval 5
  <parse>
    @type cri
  </parse>
</source>

<filter demo.**>
  @type record_transformer
  <record>
    cri_stream ${record["stream"]}
  </record>
</filter>
<filter demo.**>
  @type concat
  key message
  separator ""
  use_partial_cri_logtag true
  partial_cri_logtag_key logtag
  partial_cri_stream_key cri_stream
  stream_identity_key stream
  use_first_timestamp true
  flush_interval 5
  timeout_label @PARSE
</filter>
<match demo.**>
  @type relabel
  @label @PARSE
</match>

<label @PARSE>
  # A text error is retained unchanged in message. JSON access fields are added
  # only after complete CRI fragments have been joined. CRI time remains authoritative.
  <filter demo.**>
    @type parser
    key_name message
    reserve_data true
    reserve_time true
    emit_invalid_record_to_error false
    <parse>
      @type json
      # Application timestamps remain fields; the outer CRI timestamp is used.
      time_key __unused_time_key
    </parse>
  </filter>
  <match demo.**>
    @type loki
    @id loki_output
    url "#{ENV.fetch('LOKI_URL', 'http://loki.observability.svc.cluster.local:3100')}"
    extra_labels {"app":"demo","namespace":"demo"}
    line_format json
    remove_keys cri_stream,logtag
    <label>
      stream
    </label>
    <buffer>
      @type file
      path "#{ENV.fetch('FLUENT_STATE_PATH', '/var/lib/fluentd')}/buffer/loki"
      flush_mode interval
      flush_interval 2s
      flush_thread_count 1
      chunk_limit_size 1m
      total_limit_size 512m
      overflow_action block
      retry_type exponential_backoff
      retry_max_interval 30s
      retry_forever true
      flush_at_shutdown false
    </buffer>
  </match>
</label>

<source>
  @type monitor_agent
  bind 0.0.0.0
  port 24220
</source>

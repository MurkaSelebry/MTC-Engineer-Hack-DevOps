apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy-proxy
  namespace: observability
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames: [envoy-gateway-system]
  selector:
    matchLabels:
      app.kubernetes.io/component: proxy
      app.kubernetes.io/managed-by: envoy-gateway
  podMetricsEndpoints:
    - port: metrics
      path: /stats/prometheus
      interval: 15s
      relabelings:
        - targetLabel: job
          replacement: envoy-proxy

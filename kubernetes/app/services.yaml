apiVersion: v1
kind: Service
metadata:
  name: demo-v1
  namespace: demo
  labels:
    app.kubernetes.io/name: demo
    app.kubernetes.io/version: v1
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: demo
    app.kubernetes.io/version: v1
  ports:
    - port: 80
      targetPort: http

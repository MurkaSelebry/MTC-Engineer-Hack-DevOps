kind: Service
metadata:
  name: demo-v2
  namespace: demo
  labels:
    app.kubernetes.io/name: demo
    app.kubernetes.io/version: v2
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: demo
    app.kubernetes.io/version: v2
  ports:
    - port: 80
      targetPort: http
